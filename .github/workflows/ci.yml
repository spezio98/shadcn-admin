name: Continuous Integration

on:
  # Manual-only for now — intentional failing tests in tests/tests/** (report-reading
  # exercise) are being pushed and should not trigger CI runs. `on: {}` looked like it
  # meant "no triggers" but GitHub Actions treats it as an invalid workflow, producing a
  # failed run on every push instead of skipping it — workflow_dispatch is the valid way
  # to keep this file present but non-automatic.
  # Restore before merging real work:
  # push:
  #   branches:
  #     - main
  #
  # pull_request:
  #   branches:
  #     - main
  workflow_dispatch: {}

jobs:
  install-lint-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint the code
        run: pnpm lint

      # - name: Analyze unused files and dependencies
      #   run: pnpm knip

      - name: Run Prettier check
        run: pnpm format:check

      - name: Install browsers
        run: pnpm test:browser:install

      - name: Run tests
        run: pnpm test

      - name: Build the project
        run: pnpm build
