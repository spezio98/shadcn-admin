name: E2E business report

on:
  workflow_dispatch: {}

jobs:
  e2e-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Caches the downloaded browser binaries only, keyed on the lockfile so a
      # @playwright/test bump busts it automatically. install-deps (OS-level libs) still
      # runs every time — it's fast and doesn't need the cache.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm test:browser:install

      - name: Install browser OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Type-check e2e tests
        run: pnpm exec tsc -p tests/tsconfig.json --noEmit

      - name: Run Playwright tests
        id: e2e
        continue-on-error: true
        run: node node_modules/@playwright/test/cli.js test

      - name: Build business report
        if: always()
        continue-on-error: true
        run: pnpm run report:build

      - name: Write job summary
        if: always()
        continue-on-error: true
        run: node scripts/e2e-report/summary.mjs --run run.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload developer report (with traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload business report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-business
          path: report-business.html
          retention-days: 14
