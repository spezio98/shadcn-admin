name: E2E business report

on:
  workflow_dispatch: {}

# Prevent two manually-triggered runs from racing on the same shared dev-server port.
concurrency:
  group: e2e-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Caches the downloaded browser binaries only, keyed on the lockfile so a
      # @playwright/test bump busts it automatically. install-deps (OS-level libs) still
      # runs every time — it's fast and doesn't need the cache.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm test:browser:install

      - name: Install browser OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Type-check e2e tests
        run: pnpm exec tsc -p tests/tsconfig.json --noEmit

      - name: Run Playwright tests
        id: e2e
        continue-on-error: true
        run: node node_modules/@playwright/test/cli.js test

      - name: Build business report
        if: always()
        continue-on-error: true
        run: pnpm run report:build

      - name: Write job summary
        if: always()
        continue-on-error: true
        run: node scripts/e2e-report/summary.mjs --run run.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload developer report (with traces)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload business report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: report-business
          path: report-business.html
          retention-days: 14

      # Evaluation report — parallel to, not replacing, the two above. allure-playwright
      # writes raw results to allure-results/ as tests run; this turns them into the
      # browsable HTML site.
      - name: Generate Allure report
        if: always()
        continue-on-error: true
        run: npx allure generate ./allure-results -o ./allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14
