workflow: wf.forgot_password_to_otp
summary: "Forgot Password with a valid email -> OTP screen -> submit a 6-digit code"
preconditions: []
steps:
  - screen: auth.sign_in
    action: { click: forgot_password_link }
  - screen: auth.forgot_password
    action: { fill: { element: email_input, text: "test@example.com" } }
  - screen: auth.forgot_password
    action: { click: continue_button }
    description: "Shows an 'Email sent to test@example.com' toast and navigates to auth.otp."
  - screen: auth.otp
    assert: [otp_input, verify_button]
    description: "verify_button starts disabled again on this fresh screen."
  - screen: auth.otp
    action: { fill: { element: otp_input, text: "123456" } }
  - screen: auth.otp
    action: { click: verify_button }
    description: "Any 6-digit code is accepted (no real backend): shows a toast echoing '{ \"otp\": \"123456\" }', then verify_button re-disables. No navigation."
covered_by:
  - tests/tests/auth/auth.spec.ts#wf.forgot_password_to_otp
known_issues: []
